<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODAY — 할 일</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <p class="brand">Study01</p>
        <h1>Today</h1>
        <p class="tagline">오늘 할 일을 확인하고 체크하세요</p>
      </header>

      <main class="layout">
        <section class="panel calendar-panel" aria-labelledby="month-label">
          <div class="month-bar">
            <button type="button" class="nav-btn" id="prev-month" aria-label="이전 달">
              ‹
            </button>
            <h2 id="month-label"></h2>
            <button type="button" class="nav-btn" id="next-month" aria-label="다음 달">
              ›
            </button>
          </div>
          <div class="weekdays" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="days" id="calendar-days" aria-labelledby="month-label"></div>
        </section>

        <section class="panel day-panel" aria-labelledby="selected-date-label">
          <p class="eyebrow" id="today-badge" hidden>오늘</p>
          <h2 id="selected-date-label"></h2>
          <p class="count" id="task-count"></p>

          <form id="add-form" class="add-form">
            <label class="sr-only" for="task-input">할 일 추가</label>
            <input
              id="task-input"
              name="title"
              type="text"
              maxlength="80"
              placeholder="할 일을 입력하고 추가하세요"
              autocomplete="off"
              required
            />
            <button type="submit">추가</button>
          </form>

          <ul class="task-list" id="task-list"></ul>
          <p class="empty" id="empty-state">이 날의 할 일이 없습니다.</p>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
